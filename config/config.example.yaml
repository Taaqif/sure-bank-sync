# Copy to config/config.yaml. Any value can reference env vars as ${VAR}
# or a file (e.g. docker secret) as ${file:/run/secrets/name}.

sure:
  url: http://sure-web:3000          # base URL of your Sure instance
  source: sure-bank-sync             # tag written on each transaction (used for dedupe)

timezone: Australia/Melbourne
schedule: "0 6 * * *"                # default cron for every connection
lookback_days: 30                    # how far back each run fetches
skip_pending: true                   # don't import pending transactions (they change)
mfa_timeout_seconds: 300             # how long a run waits for an OTP in the web UI

web:
  host: 0.0.0.0
  port: 8686
  # Optional basic auth for the status UI. Leave out to disable.
  username: admin
  password: ${WEB_PASSWORD}

# One entry per household member. Each uses their own Sure API key
# (Settings -> API Keys in Sure, read_write scope).
users:
  - name: alice
    sure_api_key: ${ALICE_SURE_API_KEY}
    connections:
      - id: alice-anz
        provider: anz
        credentials:
          customer_id: ${ALICE_ANZ_CRN}
          password: ${ALICE_ANZ_PASSWORD}
        # Map bank accounts to Sure accounts. `match` is compared against the
        # bank's account number / last digits / name (substring, case-insensitive).
        accounts:
          - match: "1234"
            sure_account_id: 00000000-0000-0000-0000-000000000000
          - match: "Online Saver"
            sure_account_id: 00000000-0000-0000-0000-000000000000

      - id: alice-amex
        provider: amex
        schedule: "30 6 * * *"       # optional per-connection override
        credentials:
          username: ${ALICE_AMEX_USERNAME}
          password: ${ALICE_AMEX_PASSWORD}
        accounts:
          - match: "1005"
            sure_account_id: 00000000-0000-0000-0000-000000000000

  - name: bob
    sure_api_key: ${BOB_SURE_API_KEY}
    connections:
      - id: bob-anz
        provider: anz
        enabled: false               # keep config, skip runs
        credentials:
          customer_id: ${BOB_ANZ_CRN}
          password: ${BOB_ANZ_PASSWORD}
        accounts:
          - match: "5678"
            sure_account_id: 00000000-0000-0000-0000-000000000000
