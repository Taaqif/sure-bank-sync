services:
  sure-bank-sync:
    # Built from source by default. To use the image published by the GitHub
    # workflow instead, remove "build" and set the image, e.g.
    #   image: ghcr.io/<your-github-user>/sure-bank-sync:latest
    build: .
    image: sure-bank-sync:latest
    container_name: sure-bank-sync
    restart: unless-stopped
    ports:
      # Host port : the app's port inside the container (SURE_SYNC_PORT in .env, default 8686)
      - "${HOST_PORT:-8686}:${SURE_SYNC_PORT:-8686}"
    env_file: .env
    environment:
      TZ: ${TZ:-Australia/Melbourne}
    volumes:
      - sure-sync-data:/data
    # Docker keeps its own copy of stdout; cap it too (app log file is capped separately)
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    # Chromium needs more shared memory than Docker's 64MB default
    shm_size: "1gb"
    # Lets the Sure URL setting use http://host.docker.internal:<port> when Sure runs on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # If Sure runs in another compose project, join its network instead:
    # networks: [sure]

volumes:
  sure-sync-data:
    # Fixed name, so the same data is used whatever folder this file is in.
    # Back it up: it holds settings, encrypted logins and the synced record.
    name: sure-bank-sync-data

