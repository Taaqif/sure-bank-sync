{% extends "base.html" %}
{% block content %}
<div id="status">{% include "_status.html" %}</div>
{% endblock %}
{% block scripts %}
<script>
  // Refresh status every 5s, but never while someone is typing an MFA code.
  setInterval(async () => {
    const typing = [...document.querySelectorAll("#status input")].some(i => i.value || i === document.activeElement);
    if (typing) return;
    try {
      const r = await fetch("/partials/status", { credentials: "same-origin" });
      if (r.ok) document.getElementById("status").innerHTML = await r.text();
    } catch {}
  }, 5000);
</script>
{% endblock %}
